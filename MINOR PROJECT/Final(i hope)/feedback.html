<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Page</title>
  <link rel="stylesheet" href="feedback.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <section class="contact">
        <h2>FEEDBACK</h2>
        <form action="https://api.web3forms.com/submit" method="POST" id="feedbackForm" >
            <input type="hidden" name="access_key" value="e84d30f5-b461-4512-a657-93e02f6b271e">
            <div class="input-box">
                <div class="input-field field">
                    <input type="text" placeholder="Full Name" id="name" class="item" name="full_name" autocomplete="off" required>
                </div>
                <div class="input-field field">
                    <input type="email" placeholder="Email Address" id="email" class="item" name="email" autocomplete="off" required>
                </div>
            </div>
            <div class="input-box">
                <div class="input-field field">
                    <input type="text" placeholder="Phone No." id="phone" class="item" name="phone" autocomplete="off" required>
                </div>
                <div class="input-field field">
                    <input type="text" placeholder="Subject" id="subject" class="item" name="subject" autocomplete="off" required>
                </div>
            </div>
            <div class="textarea-field field">
                <textarea id="message" cols="30" rows="10" placeholder="Your Message" class="item" name="message" autocomplete="off" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <button type="button" id="buttonhome" onclick="location.href='home.html'"> Home </button>
    
</body>
</html>
